<!doctype html>
<html lang="cs">
<head>
 <meta charset="utf-8">
 <meta name="viewport" content="width=device-width, initial-scale=1">
 <link rel="icon" type="image/png" href="favicon.png">
 <title>Union Cosmetic Apps</title>
 <style>
  :root{--blue:#214a84;--hover:#193963;--focus:#9bb9e1}
  *{box-sizing:border-box}
  body{min-height:100vh;margin:0;padding:32px 0;display:flex;align-items:center;justify-content:center;background:#f6f8fa;color:#1f2328;font-family:"Segoe UI",Arial,sans-serif}
  main{width:min(700px,calc(100% - 40px))}
  h1{margin:0 0 36px;text-align:center;font-size:clamp(1.8rem,5vw,2.5rem);line-height:1.2}
  .button-group{display:grid;gap:24px;grid-template-columns:1fr}
  .app-card{width:100%;height:156px;padding:20px 28px;border-radius:18px;background:var(--blue);color:#fff;box-shadow:0 8px 22px #1f232824;display:flex;align-items:center;justify-content:center;gap:20px;text-decoration:none;font:inherit;font-size:clamp(1.2rem,3vw,1.8rem);transition:background-color 160ms ease,transform 160ms ease}
  a.app-card:hover{background:var(--hover);transform:translateY(-2px)}
  a:focus-visible{outline:4px solid var(--focus);outline-offset:4px}
  .app-icon{width:42px;height:42px;flex:0 0 42px;display:grid;place-items:center;border:1px solid #ffffff4d;border-radius:11px;background:#ffffff1f}
  .app-icon svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .app-label{line-height:1.25}
  .jason-card{flex-direction:column;gap:16px}
  .app-heading{display:flex;align-items:center;justify-content:center;gap:16px}
  .app-heading h2{margin:0;font:inherit}
  .version-actions{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%;max-width:470px}
  .version-link{padding:10px 12px;text-align:center;border-radius:9px;border:1px solid #ffffff80;color:#fff;text-decoration:none;font-size:14px;line-height:1.3;font-weight:600;background:#ffffff12}
  .version-link:hover{background:#ffffff30}
  .version-link.live{background:white;color:var(--blue)}
  .version-link.live:hover{background:#e8eff8}
  @media(max-width:560px){main{width:calc(100% - 28px)}h1{margin-bottom:26px}.button-group{gap:18px}.app-card{padding:18px;gap:14px;font-size:1.2rem}.jason-card{gap:16px}.version-actions{gap:8px}.version-link{font-size:12px;padding:10px 8px}}
 </style>
</head>
<body>
 <main>
  <h1>Choose app / Vyber apku</h1>
  <div class="button-group">
   <a class="app-card" href="./JSON%20edit%20GUI/" target="_blank" rel="noopener" aria-label="Otevřít původní Jason – editor dat">
    <span class="app-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="14" height="16" rx="2"></rect><path d="M3 9h14M8 9v11M3 14h9m1.5 4.5.7-3 5.6-5.6a1.4 1.4 0 0 1 2 2l-5.6 5.6-2.7 1zm5.3-7.6 2 2"></path></svg></span>
    <span class="app-label">„Jason“ (Editor dat)</span>
   </a>
   <section class="app-card jason-card" aria-labelledby="jason2-title">
    <div class="app-heading"><span class="app-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"></rect><path d="M3 9h18M9 9v11m4-5 2 2 4-4"></path></svg></span><h2 id="jason2-title">„Jason 2.0“</h2></div>
    <div class="version-actions">
     <a class="version-link live" href="./Jason2/" target="_blank" rel="noopener" aria-label="Jason 2.0 – ostrá verze">Ostrá verze</a>
     <a class="version-link" href="./Jason2/test/" target="_blank" rel="noopener" aria-label="Jason 2.0 – testovací verze">Testovací verze</a>
    </div>
   </section>
   <a class="app-card" href="./OrderSheet/" target="_blank" rel="noopener" aria-label="Otevřít Order Sheet – objednávkový formulář">
    <span class="app-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="5" y="4" width="14" height="17" rx="2"></rect><path d="M9 4V2.8h6V4M9 9h6M9 13h6M9 17h4"></path></svg></span>
    <span class="app-label">„Fredy“ / Order Sheet</span>
   </a>
  </div>
 </main>
</body>
</html>
